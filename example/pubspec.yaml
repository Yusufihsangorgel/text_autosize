name: text_autosize_example
description: Demonstrates the text_autosize package.
publish_to: none

environment:
  # The example depends on the Flutter SDK, so it has to say so: without this
  # pub resolves it as a plain Dart package and the resolution fails during
  # `flutter pub publish`.
  flutter: ">=3.22.0"
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  text_autosize:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  # Only for test/scaler_capture_test.dart, which renders the TextScaler panel
  # to the still image used in the README.
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
