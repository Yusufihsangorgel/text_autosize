name: text_autosize
description: >-
  Automatically resize text to fit its bounds: shrink the font until the text
  fits the available width, height and maxLines. TextScaler-aware,
  API-compatible with auto_size_text.
version: 1.2.1
repository: https://github.com/Yusufihsangorgel/text_autosize
topics:
  - text
  - autosize
  - typography
  - responsive
  - widgets

screenshots:
  - description: >-
      The font steps down as text grows inside a fixed box, and an
      AutoSizeGroup keeps two texts at the same synchronized size.
    path: doc/demo.gif
  - description: >-
      Under a 2.0x nonlinear font scale, the fit measured with the scaler
      stays inside the box while a fit derived from one factor overflows.
    path: doc/scaler.png

  - description: >-
      Why one scale factor is not enough: sampled at 40 pt it predicts 21 pt
      for the fitted 14 pt text, where the platform paints 28.
    path: doc/scaler-curve.png
environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
