<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#E2E8F0" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#0B1220"/>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <!-- Motif: the same glyph at three shrinking sizes, the last one
       fitting inside its box -->
  <g font-family="Menlo, 'DejaVu Sans Mono', monospace" font-weight="bold"
     fill="none" stroke="#38BDF8" stroke-width="3">
    <text x="812" y="240" font-size="150" opacity="0.4">A</text>
    <text x="920" y="240" font-size="100" opacity="0.7">A</text>
    <text x="1010" y="240" font-size="58">A</text>
    <rect x="996" y="182" width="70" height="70" rx="10"/>
  </g>

  <!-- Wordmark -->
  <text x="64" y="300" font-family="Menlo, 'DejaVu Sans Mono', monospace"
        font-size="64" font-weight="bold" fill="#E2E8F0">text_autosize</text>
  <text x="64" y="344" font-family="Menlo, 'DejaVu Sans Mono', monospace"
        font-size="24" fill="#94A3B8">Text that resizes to fit its bounds</text>
</svg>
