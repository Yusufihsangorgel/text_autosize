name: ci

on:
  push:
    branches: [main]
  pull_request:

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '7 4 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # An empty version resolves to the latest stable release. 3.32.0 is
        # the oldest Flutter version declared in pubspec.yaml.
        flutter-version: ["", "3.32.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      - run: flutter pub get
      # Formatter output can differ between Dart releases, so the format
      # check only runs against the latest stable.
      - if: matrix.flutter-version == ''
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags demo
      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
